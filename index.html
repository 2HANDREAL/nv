<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhật Ký Bé Ngoan</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Sử dụng font Nunito siêu dễ thương -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Bảng màu Pastel kẹo ngọt */
            --bg-app: #fff0f5; /* LavenderBlush */
            --bg-card: #ffffff;
            --primary: #ff8fab; /* Sweet Pink */
            --primary-dark: #fb6f92;
            --primary-light: #ffe5ec;
            --success: #80ed99; /* Mint Green */
            --success-dark: #57cc99;
            --text-main: #5c4d5c; /* Soft dark purple instead of harsh black */
            --text-muted: #9d8f9d;
            --border: #f8e5ee;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            font-family: 'Nunito', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; /* Tránh bôi đen text khi bấm */
        }

        body { 
            background-color: #f7e8f0; 
            color: var(--text-main); 
            display: flex; justify-content: center; 
            min-height: 100vh; 
        }

        .app-container {
            width: 100%; max-width: 480px; 
            background-color: var(--bg-app);
            min-height: 100vh; display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(251, 111, 146, 0.15); 
            position: relative; overflow-x: hidden;
        }

        /* --- Header & Dashboard --- */
        .dashboard-header {
            background: linear-gradient(145deg, #ffffff 0%, #ffe5ec 100%);
            padding: 30px 25px 35px; 
            border-radius: 0 0 40px 40px; 
            box-shadow: 0 15px 30px rgba(255, 143, 171, 0.15);
            position: sticky; top: 0; z-index: 10;
        }

        .date-display { 
            font-size: 14px; font-weight: 800; color: var(--primary-dark); 
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; 
            display: flex; align-items: center; gap: 6px;
        }
        
        .header-title { 
            font-size: 26px; font-weight: 900; color: var(--text-main); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        /* Wallet Box 3D Cute */
        .wallet-box {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); 
            color: white; margin-top: 25px; padding: 22px;
            border-radius: 24px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 12px 25px rgba(251, 111, 146, 0.4);
            border: 3px solid #ffb3c6;
            position: relative; overflow: hidden;
        }
        /* Hiệu ứng bóng lóa trong ví */
        .wallet-box::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); animation: shine 4s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }

        .wallet-label { font-size: 14px; color: rgba(255,255,255,0.9); font-weight: 700; margin-bottom: 5px; }
        .wallet-balance { font-size: 32px; font-weight: 900; letter-spacing: 0.5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        
        .btn-withdraw {
            background: white; color: var(--primary-dark); border: none; padding: 12px 18px;
            border-radius: 16px; font-weight: 800; font-size: 14px; cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative; z-index: 2;
        }
        .btn-withdraw:active { transform: scale(0.9); }

        /* --- Progress Section Cute --- */
        .progress-section { padding: 30px 25px 15px; }
        .progress-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 12px;}
        .progress-text { font-size: 17px; font-weight: 800; color: var(--text-main); }
        .progress-subtext { font-size: 15px; color: var(--primary-dark); font-weight: 800; background: var(--primary-light); padding: 4px 12px; border-radius: 12px; }
        
        .progress-bar-bg { width: 100%; height: 16px; background: #fdf0f4; border-radius: 20px; overflow: hidden; border: 2px solid var(--border); box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);}
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--success), var(--success-dark)); width: 0%; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 20px; position: relative;}
        .progress-bar-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(255,255,255,0.3) 0%, transparent 50%); border-radius: 20px; }

        /* --- Task List --- */
        .task-list { padding: 15px 20px 50px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; flex: 1; }
        
        .task-item {
            background: white; border: 2px solid var(--border); border-radius: 20px;
            padding: 18px; display: flex; align-items: center; gap: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer;
            box-shadow: 0 6px 15px rgba(251, 111, 146, 0.05);
        }
        
        /* Hiệu ứng nhún khi bấm */
        .task-item:active:not(.completed) { transform: scale(0.96); box-shadow: 0 2px 5px rgba(251, 111, 146, 0.05); }
        
        /* Icon dễ thương cho task */
        .task-icon-bg {
            width: 46px; height: 46px; border-radius: 16px;
            background: var(--primary-light); color: var(--primary-dark);
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; transition: all 0.3s; flex-shrink: 0;
        }

        .task-content { flex: 1; }
        .task-title { font-size: 16px; font-weight: 700; color: var(--text-main); line-height: 1.4; transition: color 0.3s; }
        .task-reward { font-size: 14px; font-weight: 800; color: var(--primary-dark); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
        
        .checkbox-cute {
            width: 32px; height: 32px; border-radius: 10px; border: 3px solid #e2d1d8;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 16px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0;
            background: #faf5f7;
        }
        
        /* Completed State */
        .task-item.completed { 
            background: #fbfbfc; border-color: #f1f2f6; cursor: default; 
            box-shadow: none; transform: scale(0.98); opacity: 0.8;
        }
        .task-item.completed .task-icon-bg { background: #f1f2f6; color: #a4b0be; }
        .task-item.completed .checkbox-cute { background: var(--success); border-color: var(--success); transform: scale(1.1) rotate(5deg); }
        .task-item.completed .task-title { color: var(--text-muted); text-decoration: line-through; }
        .task-item.completed .task-reward { color: var(--text-muted); }

        /* Custom SweetAlert Kute */
        .custom-popup { border-radius: 28px !important; padding: 30px 20px !important; box-shadow: 0 20px 40px rgba(251, 111, 146, 0.2) !important; border: 4px solid #fff; }
        .swal2-title { font-family: 'Nunito', sans-serif !important; font-weight: 900 !important; color: var(--text-main) !important; font-size: 22px !important;}
        .swal2-html-container { font-family: 'Nunito', sans-serif !important; font-weight: 600 !important; color: var(--text-muted) !important; }
        .swal2-confirm, .swal2-cancel { border-radius: 16px !important; font-weight: 800 !important; font-family: 'Nunito', sans-serif !important; padding: 12px 24px !important; }
        
        .sync-status { text-align: center; font-size: 13px; padding: 15px; color: var(--text-muted); font-weight: 700; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="date-display"><i class="fas fa-calendar-day"></i> <span id="dateDisplay">Thứ ..., ...</span></div>
            <div class="header-title">
                Nhật Ký Bé Ngoan <i class="fas fa-seedling" style="color: var(--success-dark); font-size: 28px; animation: bounce 2s infinite;"></i>
            </div>
            
            <div class="wallet-box">
                <div>
                    <div class="wallet-label">Quỹ Thưởng Của Bé</div>
                    <div class="wallet-balance" id="balanceDisplay">0đ</div>
                </div>
                <button class="btn-withdraw" onclick="withdrawMoney()"><i class="fas fa-gift"></i> Nhận Thưởng</button>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <div class="progress-header">
                <div class="progress-text">Tiến độ hôm nay</div>
                <div class="progress-subtext" id="progressText">0/0 hoàn thành</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Task List -->
        <div class="task-list" id="taskList">
            <!-- JS Render -->
        </div>
        
        <div class="sync-status" id="syncStatus"><i class="fas fa-spinner fa-spin"></i> Đang kết nối dữ liệu...</div>
    </div>

    <script type="module">
        const TELEGRAM_BOT_TOKEN = '8741437914:AAHZjk0SvWDeaAK3D8DPgp0Uke08ZVNd_g4';
        const TELEGRAM_CHAT_ID = '8511070091';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nhat-ky-be-ngoan-app';
        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        } catch(e) { console.error("Firebase config error"); }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Danh sách 15 nhiệm vụ Ngoan đã được cập nhật - Đồng giá 5k - Kèm Icon kute
        const tasks = [
            { id: 't1', desc: 'Uống đủ 2 lít nước hôm nay', icon: 'fa-glass-water' },
            { id: 't2', desc: 'Ngủ sớm trước 23h đêm qua', icon: 'fa-moon' },
            { id: 't3', desc: 'Đắp mặt nạ / Chăm sóc da kỹ càng', icon: 'fa-spa' },
            { id: 't4', desc: 'Đi bộ hoặc vận động nhẹ 30 phút', icon: 'fa-person-walking' },
            { id: 't5', desc: 'Dọn bàn vi tính gọn gàng', icon: 'fa-desktop' },
            { id: 't6', desc: 'Ăn đủ 1 bữa có nhiều rau xanh', icon: 'fa-leaf' },
            { id: 't7', desc: 'Đọc sách hoặc nghe Podcast 30 phút', icon: 'fa-book-open' },
            { id: 't8', desc: 'Gấp chăn màn gọn gàng lúc ngủ dậy', icon: 'fa-bed' },
            { id: 't11', desc: 'Gập cất quần áo gọn gàng vào tủ', icon: 'fa-shirt' },
            { id: 't12', desc: 'Không uống trà sữa / nước ngọt có gas hôm nay', icon: 'fa-ban' },
            { id: 't13', desc: 'Dành 15 phút thiền hoặc nghe nhạc thư giãn', icon: 'fa-headphones' },
            { id: 't14', desc: 'Chuẩn bị đồ đạc / túi xách cho ngày mai từ tối nay', icon: 'fa-bag-shopping' },
            { id: 't15', desc: 'Gửi cho Daddy 1 tấm ảnh tươi tắn của bé hôm nay', icon: 'fa-camera-retro' },
            { id: 't16', desc: 'Dọn dẹp nhà cửa sạch sẽ', icon: 'fa-broom' },
            { id: 't17', desc: 'Dọn dẹp bếp ngăn nắp', icon: 'fa-kitchen-set' }
        ];

        const REWARD_AMOUNT = 5000;

        let state = {
            balance: 0,
            lastActiveDate: '',
            completedToday: [] // Mảng chứa ID các nhiệm vụ đã làm trong ngày
        };
        let isSyncing = false;
        
        // RULE 1: Strict Paths
        const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily_ngoan_v2', 'main_wallet');

        async function initCloudSync() {
            try {
                const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (authToken) {
                    await signInWithCustomToken(auth, authToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) return;

                // RULE 3: Auth Before Queries & Error Callback
                onSnapshot(stateRef, (docSnap) => {
                    if (docSnap.exists()) {
                        state = docSnap.data();
                        checkDailyReset(); // Kiểm tra qua ngày sau khi tải data
                    } else {
                        state.lastActiveDate = getCurrentDateStr();
                        saveToCloud();
                    }
                    
                    isSyncing = true;
                    document.getElementById('syncStatus').style.display = 'none';
                    updateUI();
                }, (error) => {
                    console.error("Lỗi đồng bộ:", error);
                    document.getElementById('syncStatus').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Lỗi kết nối đám mây!';
                });
            } catch (e) {
                console.error("Auth error:", e);
            }
        }

        async function saveToCloud() {
            if (!auth.currentUser) return;
            try {
                await setDoc(stateRef, state, { merge: true });
            } catch (e) { console.error("Lỗi lưu:", e); }
        }

        function getCurrentDateStr() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return (new Date(now - offset)).toISOString().split('T')[0]; 
        }

        function formatDisplayDate() {
            const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
            const now = new Date();
            return `${days[now.getDay()]}, ${now.getDate()} Tháng ${now.getMonth() + 1}`;
        }

        function sendTelegram(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: 'HTML' })
            }).catch(e => console.error(e));
        }

        function checkDailyReset() {
            const todayStr = getCurrentDateStr();
            // Nếu ngày lưu trong DB khác với ngày hiện tại => Sang ngày mới => Reset tiến độ
            if (state.lastActiveDate !== todayStr) {
                state.lastActiveDate = todayStr;
                state.completedToday = []; 
                saveToCloud(); // Lưu cập nhật ngày mới lên cloud
            }
        }

        function updateUI() {
            document.getElementById('dateDisplay').innerText = formatDisplayDate();
            document.getElementById('balanceDisplay').innerText = state.balance.toLocaleString('vi-VN') + 'đ';
            
            // Tính toán tiến độ
            const total = tasks.length;
            const completed = state.completedToday.length;
            const percent = (completed / total) * 100;
            
            document.getElementById('progressText').innerText = `${completed}/${total} hoàn thành`;
            document.getElementById('progressBar').style.width = `${percent}%`;

            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            container.innerHTML = tasks.map(task => {
                const isCompleted = state.completedToday.includes(task.id);
                const statusClass = isCompleted ? 'completed' : '';
                const checkIcon = isCompleted ? '<i class="fas fa-check"></i>' : '';
                
                return `
                    <div class="task-item ${statusClass}" onclick="handleTaskClick('${task.id}', '${task.desc}', ${isCompleted})">
                        <div class="task-icon-bg"><i class="fas ${task.icon}"></i></div>
                        <div class="task-content">
                            <div class="task-title">${task.desc}</div>
                            <div class="task-reward"><i class="fas fa-coins"></i> +${REWARD_AMOUNT.toLocaleString('vi-VN')}đ</div>
                        </div>
                        <div class="checkbox-cute">${checkIcon}</div>
                    </div>
                `;
            }).join('');
        }

        window.handleTaskClick = function(taskId, taskDesc, isCompleted) {
            if (!isSyncing) {
                Swal.fire({title: 'Đợi xíu!', text: 'Đang kết nối dữ liệu...', icon: 'info', customClass: { popup: 'custom-popup' }, confirmButtonColor: 'var(--primary)'});
                return;
            }
            
            if (isCompleted) {
                Swal.fire({
                    title: 'Đã tích rồi nha!',
                    text: 'Bé đã hoàn thành việc này hôm nay rồi. Ngày mai quay lại làm tiếp nhé!',
                    icon: 'info',
                    confirmButtonColor: 'var(--primary)',
                    customClass: { popup: 'custom-popup' }
                });
                return;
            }

            Swal.fire({
                title: 'Hoàn thành việc ngoan?',
                html: `Bé chắc chắn đã làm xong<br><b>"${taskDesc}"</b><br>rồi chứ?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Dạ, xong rồi!',
                cancelButtonText: 'Khoan đã',
                confirmButtonColor: 'var(--success-dark)',
                cancelButtonColor: '#ffb3c6',
                customClass: { popup: 'custom-popup' },
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    processCompletion(taskId, taskDesc);
                }
            });
        }

        function processCompletion(taskId, taskDesc) {
            state.balance += REWARD_AMOUNT;
            state.completedToday.push(taskId);
            saveToCloud(); // Đồng bộ ngay lên mây
            
            // Hiệu ứng pháo giấy rực rỡ kute
            const colors = ['#ff8fab', '#fb6f92', '#80ed99', '#ffffff', '#ffe5ec'];
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.7 }, colors: colors });
            
            sendTelegram(`🌱 <b>NHẬT KÝ BÉ NGOAN</b>\n\n✅ <b>Bé vừa hoàn thành:</b> ${taskDesc}\n💰 <b>Thưởng:</b> +${REWARD_AMOUNT.toLocaleString('vi-VN')}đ\n📈 <b>Tổng quỹ:</b> ${state.balance.toLocaleString('vi-VN')}đ\n\nDaddy mau khen bé đi kìa!`);
        }

        window.withdrawMoney = function() {
            if (!isSyncing) return;
            if (state.balance <= 0) {
                Swal.fire({ 
                    title: 'Ví bé trống trơn', 
                    text: 'Bé chưa tích lũy được đồng nào cả. Chăm chỉ làm việc ngoan nhé!', 
                    icon: 'warning', 
                    confirmButtonColor: 'var(--primary)', 
                    customClass: { popup: 'custom-popup' }
                });
                return;
            }
            
            Swal.fire({
                title: 'Đập Heo Đất?',
                text: `Bé muốn rút toàn bộ ${state.balance.toLocaleString('vi-VN')}đ về tài khoản chứ?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Rút Ngay!',
                cancelButtonText: 'Để dành tiếp',
                confirmButtonColor: 'var(--primary)',
                cancelButtonColor: '#e2d1d8',
                customClass: { popup: 'custom-popup' },
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    sendTelegram(`💸 <b>ĐẬP HEO BÉ NGOAN!</b>\n\n💵 <b>Số tiền rút:</b> ${state.balance.toLocaleString('vi-VN')}đ\n\nDaddy mau chuyển khoản thưởng cho bé ngoan đi kìa!`);
                    state.balance = 0;
                    saveToCloud();
                    
                    // Bắn pháo bông to khi rút tiền
                    const colors = ['#ffd700', '#ff8fab', '#80ed99'];
                    confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 }, colors: colors, zIndex: 10000 });

                    Swal.fire({ 
                        title: 'Ting Ting!', 
                        text: 'Đã báo cho Daddy. Bé đợi tiền về túi nhé!', 
                        icon: 'success', 
                        confirmButtonColor: 'var(--success-dark)', 
                        customClass: { popup: 'custom-popup' }
                    });
                }
            });
        }

        // Khởi động
        document.getElementById('dateDisplay').innerText = formatDisplayDate();
        initCloudSync();
    </script>
</body>
</html>
